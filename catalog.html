<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Игротека</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo"><i class="fas fa-dice-d6"></i> Игротека</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="catalog.html" class="active">Каталог</a>
                <a href="stories.html">Истории</a>
            </nav>
            <div class="cart">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <h1>Все игры</h1>
            <div class="filter-buttons">
                <button class="filter active" data-filter="all">Все</button>
                <button class="filter" data-filter="party">Вечеринки</button>
                <button class="filter" data-filter="strategy">Стратегии</button>
                <button class="filter" data-filter="family">Семейные</button>
            </div>
            <div class="games-list" id="catalogList">
                <!-- карточки будут вставлены через JS (один раз, без пересоздания при фильтрации) -->
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>© 2025 Игротека. Все права защищены.</p>
        </div>
    </footer>
    <div id="toast" class="toast">Товар добавлен</div>
    <script src="script.js"></script>
    <script>
        const games = [
            { name:"Монополия", file:"monopoly.html", img:"monopoly.jpg", price:2490, category:"family" },
            { name:"Имаджинариум", file:"imaginarium.html", img:"imaginarium.jpg", price:1990, category:"party" },
            { name:"Колонизаторы", file:"colonizers.html", img:"colonizers.jpg", price:3490, category:"strategy" },
            { name:"Эволюция", file:"evolution.html", img:"evolution.jpg", price:2290, category:"strategy" },
            { name:"Дикие джунгли", file:"wild-jungle.html", img:"wild-jungle.jpg", price:1590, category:"party" },
            { name:"Каркассон", file:"carcassonne.html", img:"carcassonne.jpg", price:2790, category:"family" },
            { name:"UNO", file:"uno.html", img:"uno.jpg", price:890, category:"party" },
            { name:"Шахматы", file:"chess.html", img:"chess.jpg", price:1290, category:"strategy" },
            { name:"Билет на поезд", file:"ticket-to-ride.html", img:"ticket-to-ride.jpg", price:3290, category:"family" },
            { name:"Бункер", file:"bunker.html", img:"bunker.jpg", price:1890, category:"party" },
            { name:"Соображарий", file:"soobrazharium.html", img:"soobrazharium.jpg", price:1390, category:"party" },
            { name:"Скоростные колпачки", file:"speed-caps.html", img:"speed-caps.jpg", price:1190, category:"party" }
        ];
        const container = document.getElementById('catalogList');
        function renderCatalog(filter = 'all') {
            let html = '';
            for (let g of games) {
                if (filter !== 'all' && g.category !== filter) continue;
                html += `
                    <div class="game-card" data-category="${g.category}">
                        <img src="images/${g.img}" alt="${g.name}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%25%22%20height%3D%22100%25%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23333%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2250%22%20fill%3D%22%23f80%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%3ENo%20image%3C%2Ftext%3E%3C%2Fsvg%3E'">
                        <div class="game-info">
                            <h3><a href="${g.file}">${g.name}</a></h3>
                            <div class="price">${g.price.toLocaleString()} ₽</div>
                            <button data-name="${g.name}">В корзину</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            attachCartButtons();
        }
        function attachCartButtons() {
            document.querySelectorAll('.game-card button').forEach(btn => {
                btn.removeEventListener('click', window._cartHandler);
                const handler = (e) => { e.stopPropagation(); addToCart(btn.getAttribute('data-name')); };
                btn.addEventListener('click', handler);
                btn._cartHandler = handler;
            });
        }
        // фильтры
        const filters = document.querySelectorAll('.filter');
        filters.forEach(btn => {
            btn.addEventListener('click', () => {
                filters.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCatalog(btn.dataset.filter);
            });
        });
        renderCatalog('all');
    </script>
</body>
</html>
